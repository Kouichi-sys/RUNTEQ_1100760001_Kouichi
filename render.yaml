# Render Blueprint。RenderのダッシュボードでBlueprintとして読み込むと、
# Webサービスとデータベースをまとめて作成できる。
databases:
  - name: nxwitnessviewer-db
    databaseName: nxwitnessviewer
    user: nxwitnessviewer
    plan: free
    # 既にoregonに作成済みのDBをそのまま使う(無料プランはDBを1つしか作れない)
    region: oregon

services:
  - type: web
    name: nxwitness-viewer
    runtime: python
    plan: free
    # Renderの内部接続はリージョンをまたげないため、DBと同じリージョンにする
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nxwitnessviewer-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.7"
      # 社内LAN外ではNxWitness APIに到達できないため、サンプル映像で動かす
      - key: VIDEO_SOURCE
        value: mock
      # レビュー用デモアカウント。パスワードはRenderの画面で設定する
      - key: DEMO_USER_EMAIL
        value: demo@example.com
      - key: DEMO_USER_NAME
        value: デモユーザー
      - key: DEMO_USER_PASSWORD
        sync: false
